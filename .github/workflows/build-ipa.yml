# Builds an unsigned CortEX-mod.ipa on every push to main (or by hand from the Actions tab).
# Download it from the run's "Artifacts" section, then sign + install with Sideloadly/AltStore.
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-26 has Xcode 26.5; Xcode 26.3 (macos-15) times out type-checking the big SwiftUI bodies
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (unsigned)
        run: |
          xcodebuild -project EhViewer.xcodeproj -scheme EhViewer \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EhViewer.app Payload/
          zip -qry CortEX-mod.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CortEX-mod-ipa
          path: CortEX-mod.ipa

  # (mod) シミュレーター版: Mac の Xcode Simulator にドラッグ、または appetize.io に
  # アップロードしてブラウザで動作確認できる (IPA を作る前のテスト用)
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (simulator)
        run: |
          xcodebuild -project EhViewer.xcodeproj -scheme EhViewer \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Zip app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/CortEX-mod-simulator.zip" EhViewer.app

      - uses: actions/upload-artifact@v4
        with:
          name: CortEX-mod-simulator
          path: CortEX-mod-simulator.zip
